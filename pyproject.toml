[project]
name = "widerspruchjetzt"
version = "1.0.0"
description = "RAG-assisted formal Widerspruch drafts for German Jobcenter decisions"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    "urllib3>=1.26,<2.3",
    "charset-normalizer>=3.0,<4",
    "chromadb==0.5.5",
    "stripe==11.1.1",
    "reportlab==4.2.5",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "posthog>=2.4.0,<6.0.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
local = [
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "tqdm==4.66.5",
    "sentence-transformers==3.0.1",
]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

[tool.uv]
package = false
default-groups = ["dev"]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
